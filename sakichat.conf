# sakichat Nginx 配置（安装到 /etc/nginx/conf.d/sakichat.conf）
# 域名解析: saki.tayori.top  A → 120.53.226.233
server {
    listen 80;
    server_name saki.tayori.top;

    # 前端静态页
    root /opt/sakichat/public;
    index index.html;

    # WebSocket 反代 → C++ server(127.0.0.1:9000)
    location /ws {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
