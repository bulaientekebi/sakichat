<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sakichat - 简单聊天室</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ---------- 登录页 ---------- */
  #login-view {
    background: #fff;
    border-radius: 16px;
    padding: 40px;
    width: 320px;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
    text-align: center;
  }
  #login-view h1 { font-size: 28px; color: #667eea; margin-bottom: 8px; }
  #login-view p  { color: #999; font-size: 13px; margin-bottom: 28px; }
  #login-view input {
    width: 100%; padding: 12px; font-size: 15px;
    border: 2px solid #e8e8e8; border-radius: 8px;
    outline: none; margin-bottom: 16px;
  }
  #login-view input:focus { border-color: #667eea; }
  #login-btn {
    width: 100%; padding: 12px; font-size: 16px;
    background: #667eea; color: #fff; border: none;
    border-radius: 8px; cursor: pointer;
  }
  #login-btn:hover { background: #5566d8; }
  #login-tip { margin-top: 12px; font-size: 13px; color: #e74c3c; min-height: 18px; }

  /* ---------- 聊天主界面 ---------- */
  #chat-view {
    display: none;
    width: 900px; height: 600px;
    background: #fff; border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
    overflow: hidden;
  }
  .chat-container { display: flex; height: 100%; }

  /* 左侧在线列表 */
  .sidebar {
    width: 220px; background: #f7f8fc;
    border-right: 1px solid #eee;
    display: flex; flex-direction: column;
  }
  .sidebar-title {
    padding: 16px; font-weight: bold; color: #667eea;
    border-bottom: 1px solid #eee;
  }
  #user-list { flex: 1; overflow-y: auto; padding: 8px 0; }
  .user-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; cursor: pointer;
    border-left: 3px solid transparent;
  }
  .user-item:hover { background: #ecefff; }
  .user-item.active { background: #e2e6ff; border-left-color: #667eea; }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: #667eea; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
  .user-name { font-size: 14px; }
  .logout-btn {
    margin: 12px; padding: 10px;
    background: #ff6b6b; color: #fff; border: none;
    border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  .logout-btn:hover { background: #e85a5a; }

  /* 右侧聊天区 */
  .chat-main { flex: 1; display: flex; flex-direction: column; }
  .chat-header {
    padding: 16px; font-weight: bold; font-size: 16px;
    border-bottom: 1px solid #eee; color: #333;
  }
  #msg-list { flex: 1; overflow-y: auto; padding: 16px; background: #fafbfe; }
  .msg { margin-bottom: 14px; display: flex; flex-direction: column; }
  .msg.mine  { align-items: flex-end; }
  .msg.other { align-items: flex-start; }
  .msg .bubble {
    max-width: 60%; padding: 10px 14px;
    border-radius: 12px; font-size: 14px; line-height: 1.5;
    word-break: break-word;
  }
  .msg.mine  .bubble { background: #667eea; color: #fff; border-top-right-radius: 2px; }
  .msg.other .bubble { background: #fff; border: 1px solid #e8e8e8; border-top-left-radius: 2px; }
  .msg .who { font-size: 12px; color: #999; margin-bottom: 4px; }
  .msg.system { align-items: center; }
  .msg.system .bubble {
    background: #eee; color: #888; font-size: 12px;
    padding: 4px 12px; border-radius: 999px;
  }

  .input-bar {
    display: flex; gap: 10px; padding: 14px;
    border-top: 1px solid #eee;
  }
  #input-text {
    flex: 1; padding: 10px 14px; font-size: 14px;
    border: 2px solid #e8e8e8; border-radius: 8px;
    outline: none;
  }
  #input-text:focus { border-color: #667eea; }
  #send-btn {
    padding: 10px 24px; background: #667eea; color: #fff;
    border: none; border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  #send-btn:hover { background: #5566d8; }
</style>
</head>
<body>

<!-- ====== 登录视图 ====== -->
<div id="login-view">
  <h1>sakichat</h1>
  <p>简单聊天室 · WebSocket</p>
  <input id="login-name" placeholder="输入你的昵称" maxlength="12">
  <button id="login-btn">进入聊天室</button>
  <div id="login-tip"></div>
</div>

<!-- ====== 聊天视图 ====== -->
<div id="chat-view">
  <div class="chat-container">
    <div class="sidebar">
      <div class="sidebar-title">在线用户</div>
      <div id="user-list"></div>
      <button class="logout-btn" id="logout-btn">退出登录</button>
    </div>
    <div class="chat-main">
      <div class="chat-header" id="chat-header">群聊大厅</div>
      <div id="msg-list"></div>
      <div class="input-bar">
        <input id="input-text" placeholder="输入消息，回车发送" maxlength="200">
        <button id="send-btn">发送</button>
      </div>
    </div>
  </div>
</div>

<script>
// ============ 状态 ============
let ws = null;
let myName = "";
let target = "";     // 空 = 群聊；否则 = 私聊对象
let onlineUsers = []; // 在线用户列表缓存

// ============ DOM 引用 ============
const loginView = document.getElementById("login-view");
const chatView  = document.getElementById("chat-view");
const loginName = document.getElementById("login-name");
const loginTip  = document.getElementById("login-tip");
const userList  = document.getElementById("user-list");
const msgList   = document.getElementById("msg-list");
const chatHeader = document.getElementById("chat-header");
const inputText = document.getElementById("input-text");

// ============ WebSocket 连接 ============
function connect(name) {
  ws = new WebSocket("ws://120.53.226.233:8080");

  ws.onopen = () => {
    ws.send(JSON.stringify({ type: "login", username: name }));
  };

  ws.onmessage = (e) => {
    let msg;
    try { msg = JSON.parse(e.data); } catch { return; }

    if (msg.type === "login_ok") {
      myName = msg.username;
      loginView.style.display = "none";
      chatView.style.display = "block";
    } else if (msg.type === "error") {
      loginTip.textContent = msg.msg;
    } else if (msg.type === "system") {
      addSystemMsg(msg.text);
    } else if (msg.type === "chat") {
      addChatMsg(msg.from, msg.text);
    } else if (msg.type === "online_list") {
      onlineUsers = msg.users;
      renderUserList(onlineUsers);
    }
  };

  ws.onclose = () => {
    if (myName) {
      addSystemMsg("连接已断开");
    } else {
      loginTip.textContent = "无法连接服务器，请先启动 sakichat_server";
    }
  };
}

// ============ 界面渲染 ============
function renderUserList(users) {
  userList.innerHTML = "";
  users.forEach((name) => {
    const div = document.createElement("div");
    div.className = "user-item" + (name === target ? " active" : "");
    const first = (name || "?").charAt(0).toUpperCase();
    div.innerHTML =
      '<div class="avatar">' + first + "</div>" +
      '<div class="user-name">' + name + "</div>";
    div.onclick = () => selectUser(name);
    userList.appendChild(div);
  });
}

function selectUser(name) {
  target = (target === name) ? "" : name;   // 再点一次取消私聊
  chatHeader.textContent = target ? "私聊：" + target : "群聊大厅";
  renderUserList(onlineUsers);   // 重新渲染，更新 active 高亮
}

function addSystemMsg(text) {
  const div = document.createElement("div");
  div.className = "msg system";
  div.innerHTML = '<div class="bubble">' + text + "</div>";
  msgList.appendChild(div);
  scrollBottom();
}

function addChatMsg(from, text) {
  const mine = from === myName;
  const div = document.createElement("div");
  div.className = "msg " + (mine ? "mine" : "other");
  div.innerHTML =
    '<div class="who">' + (mine ? "我" : from) + "</div>" +
    '<div class="bubble">' + escapeHtml(text) + "</div>";
  msgList.appendChild(div);
  scrollBottom();
}

function scrollBottom() {
  msgList.scrollTop = msgList.scrollHeight;
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// ============ 发送消息 ============
function sendMsg() {
  const text = inputText.value.trim();
  if (!text) return;
  ws.send(JSON.stringify({ type: "chat", to: target, text: text }));
  inputText.value = "";
}

// ============ 事件绑定 ============
document.getElementById("login-btn").onclick = () => {
  const name = loginName.value.trim();
  if (!name) { loginTip.textContent = "请输入昵称"; return; }
  loginTip.textContent = "";
  connect(name);
};

loginName.onkeydown = (e) => { if (e.key === "Enter") document.getElementById("login-btn").click(); };
document.getElementById("send-btn").onclick = sendMsg;
inputText.onkeydown = (e) => { if (e.key === "Enter") sendMsg(); };

document.getElementById("logout-btn").onclick = () => {
  ws.close();
  location.reload();
};
</script>
</body>
</html>
